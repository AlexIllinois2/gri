<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GRI · GitHub Release 应用管理器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .log-line { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-200 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
      <header class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-white">GRI</h1>
          <p class="text-sm text-slate-400">GitHub Release 应用管理器 · 本地 Web 控制台</p>
        </div>
        <div class="flex gap-2">
          <button id="checkBtn" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-sm">检查更新</button>
          <button id="refreshBtn" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-sm">刷新</button>
        </div>
      </header>

      <section class="bg-slate-900 rounded-xl p-4 mb-6 border border-slate-800">
        <h2 class="text-sm font-semibold text-slate-300 mb-3">安装新应用</h2>
        <div class="flex flex-col md:flex-row gap-2">
          <input id="repoInput" placeholder="owner/repo 或本地文件路径"
            class="flex-1 px-3 py-2 rounded bg-slate-800 border border-slate-700 text-sm outline-none focus:border-emerald-500" />
          <input id="selectInput" placeholder="可选：资产名子串筛选"
            class="w-48 px-3 py-2 rounded bg-slate-800 border border-slate-700 text-sm outline-none focus:border-emerald-500" />
          <button id="installBtn" class="px-4 py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-sm font-medium">安装</button>
        </div>
      </section>

      <section>
        <h2 class="text-sm font-semibold text-slate-300 mb-3">已安装应用</h2>
        <div id="apps" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </section>

      <section class="mt-6">
        <h2 class="text-sm font-semibold text-slate-300 mb-3">任务控制台</h2>
        <div id="console" class="bg-black rounded-lg p-3 h-64 overflow-y-auto border border-slate-800"></div>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const consoleEl = $("console");

      function logLine(text, cls = "text-slate-300") {
        const div = document.createElement("div");
        div.className = "log-line " + cls;
        div.textContent = text;
        consoleEl.appendChild(div);
        consoleEl.scrollTop = consoleEl.scrollHeight;
      }

      function badge(type) {
        const map = {
          archive: "bg-sky-900 text-sky-300",
          appimage: "bg-purple-900 text-purple-300",
          rpm: "bg-red-900 text-red-300",
          deb: "bg-orange-900 text-orange-300",
          exe: "bg-green-900 text-green-300",
          raw: "bg-slate-800 text-slate-300",
        };
        return `<span class="text-[10px] px-1.5 py-0.5 rounded ${map[type] || map.raw}">${type}</span>`;
      }

      async function loadApps() {
        const res = await fetch("/api/apps");
        const apps = await res.json();
        const el = $("apps");
        if (!apps.length) {
          el.innerHTML = `<div class="text-slate-500 text-sm col-span-full">暂无应用。使用上方输入框添加或安装。</div>`;
          return;
        }
        el.innerHTML = apps
          .map((a) => {
            const id = a.repo || a.assetName;
            const name = (a.repo || a.assetName).split("/").pop();
            return `<div class="bg-slate-900 rounded-lg p-3 border border-slate-800 flex items-center justify-between">
              <div>
                <div class="font-medium text-white">${name} ${badge(a.type)} <span class="text-[10px] text-slate-400">${a.installed ? "已安装" : "未安装"}</span></div>
                <div class="text-xs text-slate-400 mt-1">${id} · ${a.version || "-"}</div>
                <div class="text-[11px] text-slate-500 mt-0.5">${a.installedAt?.slice(0, 19).replace("T", " ") || ""} ${a.source ? "· " + a.source : ""}</div>
              </div>
              <button data-remove="${id}" class="px-2 py-1 rounded bg-slate-800 hover:bg-red-900 text-xs text-red-300">移除</button>
            </div>`;
          })
          .join("");
        el.querySelectorAll("[data-remove]").forEach((b) =>
          b.addEventListener("click", () => removeApp(b.getAttribute("data-remove"))),
        );
      }

      async function removeApp(id) {
        if (!confirm("确认移除 " + id + "？")) return;
        logLine("移除 " + id, "text-yellow-300");
        const res = await fetch("/api/remove", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        const j = await res.json();
        logLine(j.ok ? "已移除 " + id : "移除失败：" + (j.error || ""), j.ok ? "text-emerald-300" : "text-red-300");
        loadApps();
      }

      function ensureWs() {
        if (window._ws && window._ws.readyState === 1) return window._ws;
        const proto = location.protocol === "https:" ? "wss" : "ws";
        const ws = new WebSocket(`${proto}://${location.host}/ws`);
        ws.onmessage = (e) => {
          const d = JSON.parse(e.data);
          if (d.kind === "log") logLine(d.line, "text-slate-300");
          else if (d.kind === "progress") logLine(`进度 ${(d.total ? ((d.bytes / d.total) * 100).toFixed(0) : d.bytes)}`, "text-sky-300");
          else if (d.kind === "done") logLine("✔ 任务完成", "text-emerald-300");
          else if (d.kind === "error") logLine("✖ " + d.message, "text-red-300");
        };
        window._ws = ws;
        return ws;
      }

      async function install() {
        const repo = $("repoInput").value.trim();
        if (!repo) return;
        const select = $("selectInput").value.trim();
        ensureWs();
        logLine("安装 " + repo, "text-emerald-300");
        const res = await fetch("/api/install", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ repo, select, allBin: true }),
        });
        const j = await res.json();
        logLine("任务 ID: " + j.jobId, "text-slate-500");
        loadApps();
      }

      async function checkUpdates() {
        ensureWs();
        logLine("检查可升级...", "text-yellow-300");
        const res = await fetch("/api/check-update", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        const list = await res.json();
        const ok = list.filter((x) => x.status === "ok");
        list.forEach((x) => {
          const color = x.status === "ok" ? "text-emerald-300" : x.status === "missing" ? "text-red-300" : "text-slate-500";
          logLine(`${x.id}: ${x.status} (${x.current}${x.latest ? " → " + x.latest : ""})`, color);
        });
        if (ok.length) {
          logLine("升级 " + ok.length + " 个应用...", "text-emerald-300");
          const r2 = await fetch("/api/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ids: ok.map((x) => x.id) }),
          });
          const j = await r2.json();
          logLine("更新任务 ID: " + j.jobId, "text-slate-500");
          loadApps();
        }
      }

      $("installBtn").addEventListener("click", install);
      $("checkBtn").addEventListener("click", checkUpdates);
      $("refreshBtn").addEventListener("click", loadApps);
      loadApps();
      ensureWs();
    </script>
  </body>
</html>
